<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Members</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:sans-serif;
        }

        body{
            background:#fff8f8;
            min-height:100vh;
            padding:40px 20px;
        }

        .container{
            max-width:1000px;
            margin:auto;
        }

        .page-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
            flex-wrap:wrap;
            gap:10px;
        }

        h2{
            color:#ef4444;
            font-size:30px;
            font-weight:700;
        }

        .back-btn{
            text-decoration:none;
            background:#ffffff;
            color:#ef4444;
            border:1px solid #fecaca;
            padding:10px 18px;
            border-radius:12px;
            font-size:14px;
            font-weight:600;
            transition:.2s;
        }

        .back-btn:hover{
            background:#fff5f5;
        }

        .table-card{
            background:#fff;
            border-radius:20px;
            overflow:hidden;

            box-shadow:
                0 10px 30px rgba(239,68,68,.08);

            border:1px solid #ffe4e6;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        thead{
            background:linear-gradient(
                135deg,
                #ef4444,
                #fb7185
            );
        }

        thead th{
            color:#fff;
            font-size:14px;
            font-weight:700;
            text-align:left;
            padding:16px;
        }

        tbody td{
            padding:16px;
            font-size:14px;
            color:#444;
            border-bottom:1px solid #ffe4e6;
        }

        tbody tr:last-child td{
            border-bottom:none;
        }

        tbody tr:hover{
            background:#fff5f5;
        }

        .member-name{
            font-weight:600;
            color:#7f1d1d;
        }

        .edit-btn{
            display:inline-block;
            text-decoration:none;

            background:linear-gradient(
                135deg,
                #ef4444,
                #fb7185
            );

            color:#fff;
            padding:8px 16px;
            border-radius:10px;

            font-size:13px;
            font-weight:600;

            transition:.2s;
        }

        .edit-btn:hover{
            transform:translateY(-1px);
        }

        .empty-state{
            text-align:center;
            padding:40px;
            color:#9ca3af;
        }

        @media (max-width:768px){

            body{
                padding:20px 10px;
            }

            h2{
                font-size:24px;
            }

            thead th,
            tbody td{
                padding:12px;
                font-size:13px;
            }

            .edit-btn{
                padding:6px 12px;
                font-size:12px;
            }

            .back-btn{
                padding:8px 14px;
                font-size:13px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="page-header">
        <h2>સભ્યોની યાદી</h2>

        <a href="{% url 'home' %}" class="back-btn">
            ← પાછા જાઓ
        </a>
    </div>

    <div class="table-card">

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>નામ</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                {% for member in members %}
                <tr>
                    <td>{{ forloop.counter }}</td>

                    <td class="member-name">
                        {{ member.name }}
                    </td>

                    <td>
                        <a href="{% url 'edit_member' member.id %}"
                           class="edit-btn">
                            ✏️ Edit
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="empty-state">
                        કોઈ સભ્ય મળ્યો નથી.
                    </td>
                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
