<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{
    box-sizing:border-box;
}

body{
    background:#fff8f8;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    margin:0;
    font-family:sans-serif;
}

/* ===== FORM FIELDS ===== */

.field-group{
    margin-bottom:14px;
}

.field-group label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:#7f1d1d;
    margin-bottom:4px;
}

.field-group input,
.field-group select{
    width:100%;
    border:1px solid #fecaca;
    border-radius:12px;
    padding:10px 12px;
    font-size:13px;
    outline:none;
    color:#7f1d1d;
    background:#fff;
    transition:.2s;
}

.field-group input:focus,
.field-group select:focus{
    border-color:#ef4444;
    box-shadow:0 0 0 4px rgba(239,68,68,.12);
}

/* ===== HEADER ===== */

.header{
    width:100%;
    background:linear-gradient(
        135deg,
        #ef4444,
        #fb7185
    );

    box-shadow:
        0 4px 20px rgba(239,68,68,.15);

    padding:12px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;
    z-index:999;
}

.logo{
    font-size:16px;
    font-weight:800;
    color:#fff;
}

.nav{
    display:flex;
    gap:18px;
}

.nav a{
    text-decoration:none;
    font-size:14px;
    font-weight:600;

    color:#fff;

    padding:8px 12px;
    border-radius:10px;

    transition:.2s;
}

.nav a:hover{
    background:rgba(255,255,255,.18);
}

.menu-btn{
    display:none;
    font-size:26px;
    cursor:pointer;
    color:#fff;
}

/* ===== FORM CARD ===== */

.bg-white{
    background:#fff !important;

    border:1px solid #fecaca;

    border-radius:22px !important;

    box-shadow:
        0 20px 40px rgba(239,68,68,.10) !important;
}

/* ===== TITLE ===== */

h2{
    color:#ef4444 !important;
}

/* ===== CANCEL BUTTON ===== */

a.flex-1{
    border:1px solid #fecaca !important;
    color:#ef4444 !important;
    border-radius:12px !important;
    transition:.2s;
}

a.flex-1:hover{
    background:#fff1f2 !important;
}

/* ===== SAVE BUTTON ===== */

button[type="submit"]{
    border-radius:12px !important;
    transition:.2s;
}

/* First Save Button */
button.bg-purple-700{
    background:linear-gradient(
        135deg,
        #ef4444,
        #fb7185
    ) !important;

    border:none !important;
}

button.bg-purple-700:hover{
    background:linear-gradient(
        135deg,
        #dc2626,
        #ef4444
    ) !important;
}
.add-btn {
    position: absolute;
    right: 20px;

    background: rgba(255,255,255,.95);
    color: #ef4444;

    border: none;
    border-radius: 12px;

    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;

    transition: .2s;
}

.add-btn:hover {
    background: #fff;
    transform: translateY(-1px);

/* Delete Button */
button.w-full.mt-3{
    border:1px solid #fecaca !important;
    color:#ef4444 !important;
    background:#fff !important;
    border-radius:12px !important;
}

button.w-full.mt-3:hover{
    background:#fff1f2 !important;
}

/* ===== MOBILE ===== */

@media (max-width: 768px) {

    .site-header {
        padding: 0 12px;
    }

    .site-header h1 {
        font-size: 14px;
        max-width: 55%;
    }

    .add-btn {
        padding: 6px 10px;
        font-size: 12px;
    }
}
</style> 
</head>

<body class="min-h-screen flex flex-col">

<!-- ===== HEADER ===== -->
<header class="header">
    <div class="logo">
        વેપારી કુટુંબનો શાજરો
    </div>
        <button class="add-btn" onclick="openModal('addModal')">+ નવો સભ્ય</button>



</header>

<!-- ===== FORM ===== -->
<div class="flex items-center justify-center p-4 flex-1">

<div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

    <h2 class="text-center text-xl font-bold mb-6">
        સભ્ય સંપાદિત કરો
    </h2>

    <form method="POST">
      {% csrf_token %}

      <div class="field-group">
        <label>નામ *</label>
        <input type="text" name="name" value="{{ member.name }}" required />
      </div>

      <div class="field-group">
        <label>પિતાનું નામ</label>
        <select name="parent">
          <option value="">-- કોઈ નહીં (મૂળ) --</option>
          {% for m in members %}
            <option value="{{ m.id }}"
              {% if member.parent and member.parent.id == m.id %}selected{% endif %}>
              {{ m.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="field-group">
        <label>જન્મ તારીખ</label>
        <input type="date" name="birth_date"
               value="{{ member.birth_date|date:'Y-m-d' }}" />
      </div>

      <div class="field-group">
        <label>અવસાન તારીખ <span style="font-size:10px;color:#9ca3af;">(વૈકલ્પિક)</span></label>
        <input type="date" name="death_date"
               value="{{ member.death_date|date:'Y-m-d' }}" />
      </div>

      <div class="flex gap-3 mt-6">
        <a href="{% url 'home' %}"
           class="flex-1 text-center border border-purple-400 text-purple-700 font-semibold rounded-lg py-2 text-sm hover:bg-purple-50">
            રદ કરો
        </a>
        <button type="submit"
                class="flex-1 bg-purple-700 text-white font-semibold rounded-lg py-2 text-sm hover:bg-purple-800">
            સાચવો
        </button>
      </div>
    </form>

    <form method="POST" action="{% url 'delete_member' member.id %}"
          onsubmit="return confirm('શું તમે આ સભ્યને કાઢી નાખવા માંગો છો?')">
      {% csrf_token %}
      <button type="submit"
              class="w-full mt-3 border border-red-300 text-red-500 font-semibold rounded-lg py-2 text-sm hover:bg-red-50">
          કાઢી નાખો
      </button>
    </form>

</div>

</div>

<!-- ===== JS ===== -->
<script>
function toggleMenu() {
    document.getElementById("navMenu").classList.toggle("active");
}
</script>

</body>
</html>
