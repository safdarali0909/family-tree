<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #fff8f8;
    font-family: sans-serif;
}

/* Tree Area */
.tree-scroll {
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    width: 100vw;
    height: calc(100vh - 60px);
    cursor: grab;
    position: relative;
    margin-top: 60px;
}
.tree-scroll:active {
    cursor: grabbing;
}

.tree-wrap {
    display: inline-block;
    min-width: max-content;
    padding: 60px 400px;
    position: relative;
    transform-origin: top center;
}

#connector-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
}

/* Tree Structure */
.tree-node {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.tree-children {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 20px;
    margin-top: 40px;
}

/* Person Cards */
.person {
    display: inline-block;
    border: 1px solid #fecaca;
    border-radius: 14px;
    background: #ffffff;
    color: #7f1d1d;
    font-weight: 600;
    font-size: 12px;
    padding: 8px 14px;
    white-space: nowrap;
    position: relative;
    z-index: 1;
    text-align: center;

    box-shadow:
        0 4px 10px rgba(239,68,68,.08);
    transition: all .2s ease;
}

.person:hover {
    background: #fff5f5;
    transform: translateY(-2px);
}

.person a {
    font-size: 11px;
    text-decoration: none;
    margin-left: 4px;
    color: #ef4444;
}

.person .dt {
    display: block;
    font-size: 10px;
    font-weight: 400;
    color: #fb7185;
    margin-top: 2px;
}

/* Header */
.site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;

    background: linear-gradient(
        135deg,
        #ef4444,
        #fb7185
    );

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 16px;
    z-index: 200;
    gap: 12px;

    box-shadow:
        0 4px 20px rgba(239,68,68,.18);
}

.site-header h1 {
    color: #fff;
    font-size: 18px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    max-width: 60%;
    flex: 1;
    min-width: 0;
}

/* Add Button */
.add-btn {
    position: absolute;
    right: 20px;

    background: rgba(255,255,255,.95);
    color: #ef4444;

    border: none;
    border-radius: 12px;

    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;

    transition: .2s;
}

.add-btn:hover {
    background: #fff;
    transform: translateY(-1px);
}
.add-btn1 {
    position: absolute;
    right: 130px;

    background: rgba(255,255,255,.95);
    color: #ef4444;

    border: none;
    border-radius: 12px;

    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;

    transition: .2s;
}

.add-btn1:hover {
    background: #fff;
    transform: translateY(-1px);
}
/* Modal Overlay */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 300;
    align-items: center;
    justify-content: center;
}

.modal-overlay.active {
    display: flex;
}

/* Modal Box */
.modal-box {
    background: #fff;
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 420px;

    border: 1px solid #fecaca;

    box-shadow:
        0 20px 40px rgba(239,68,68,.12);
}

.modal-box h2 {
    color: #ef4444;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 20px;
    text-align: center;
}

/* Form */
.field-group {
    margin-bottom: 14px;
}

.field-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #7f1d1d;
    margin-bottom: 4px;
}

.field-group input,
.field-group select {
    width: 100%;
    border: 1px solid #fecaca;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    outline: none;
    color: #7f1d1d;
    background: #fff;
}

.field-group input:focus,
.field-group select:focus {
    border-color: #ef4444;
    box-shadow:
        0 0 0 4px rgba(239,68,68,.12);
}

/* Buttons */
.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.btn-save {
    flex: 1;

    background: linear-gradient(
        135deg,
        #ef4444,
        #fb7185
    );

    color: #fff;
    border: none;
    border-radius: 12px;

    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;

    transition: .2s;
}

.btn-save:hover {
    background: linear-gradient(
        135deg,
        #dc2626,
        #ef4444
    );
}

.btn-cancel {
    flex: 1;
    background: #fff;
    color: #ef4444;

    border: 1px solid #fecaca;
    border-radius: 12px;

    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;

    transition: .2s;
}

.btn-cancel:hover {
    background: #fff1f2;
}

/* Fit Button */
#btn-fit {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 100;

    background: #fff;
    border: 1px solid #fecaca;
    color: #ef4444;

    font-weight: 600;
    font-size: 13px;

    padding: 8px 16px;
    border-radius: 12px;
    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(239,68,68,.08);
}

#btn-fit:hover {
    background: #fff5f5;
}

/* Zoom Controls */
#zoom-controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 100;
    display: flex;
    gap: 8px;
}

#zoom-controls button {
    background: #fff;
    border: 1px solid #fecaca;
    color: #ef4444;

    font-weight: 700;
    font-size: 18px;

    width: 38px;
    height: 38px;

    border-radius: 12px;
    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(239,68,68,.08);
}

#zoom-controls button:hover {
    background: #fff5f5;
}

#zoom-label {
    background: #fff;
    border: 1px solid #fecaca;
    color: #ef4444;

    font-size: 12px;
    font-weight: 600;

    padding: 0 12px;
    border-radius: 12px;

    display: flex;
    align-items: center;
}

/* Mobile */
@media (max-width: 768px) {

    .site-header {
        padding: 0 12px;
    }

    .site-header h1 {
        font-size: 14px;
        max-width: 55%;
    }

    .add-btn {
        padding: 6px 10px;
        font-size: 12px;
    }
}
#btn-download{
    position:fixed;
    bottom:70px;
    right:20px;

    z-index:100;

    background:#fff;
    border:1px solid #fecaca;
    color:#ef4444;

    font-weight:600;
    font-size:13px;

    padding:8px 16px;
    border-radius:12px;

    cursor:pointer;

    box-shadow:
        0 4px 12px rgba(239,68,68,.08);
}

#btn-download:hover{
    background:#fff5f5;
}
</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<body>

<!-- Header -->
<div class="site-header">
    <h1>વેપારી કુટુંબનો સજરો</h1>
    <button class="add-btn" onclick="openModal('addModal')">+ નવો સભ્ય</button>
    <button class="add-btn1" onclick="window.location.href='{% url 'member_list' %}'">
    ✏️ સભ્ય સંપાદિત કરો
</button>
</div>

<!-- Tree -->
 
<div class="tree-scroll" id="treeScroll">
  <div class="tree-wrap" id="treeWrap">
    <svg id="connector-svg"></svg>
    <div class="tree-node">
      {% for root in roots %}
        {% include "tree_node.html" with member=root %}
      {% endfor %}
    </div>
  </div>
</div>

<!-- Add Member Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <h2>નવો સભ્ય ઉમેરો</h2>
    <form method="POST" action="{% url 'add_member' %}">
      {% csrf_token %}

      <div class="field-group">
        <label>નામ *</label>
        <input type="text" name="name" placeholder="સભ્યનું નામ દાખલ કરો" required />
      </div>

      <div class="field-group">
        <label>પિતાનું નામ</label>
        <select name="parent">
          <option value="">-- કોઈ નહીં (મૂળ) --</option>
          {% for m in members %}
            <option value="{{ m.id }}">{{ m.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field-group">
        <label>જન્મ તારીખ</label>
        <input type="date" name="birth_date" />
      </div>

      <div class="field-group">
        <label>અવસાન તારીખ <span style="font-size:10px;color:#9ca3af;">(વૈકલ્પિક)</span></label>
        <input type="date" name="death_date" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal('addModal')">રદ કરો</button>
        <button type="submit" class="btn-save">સાચવો</button>
      </div>
    </form>
  </div>
</div>

<button id="btn-fit" onclick="fitToScreen()">⛶ Fit</button>
<button id="btn-download" onclick="downloadTreePDF()">
    ⬇ Download PDF
</button>
<div id="zoom-controls">
  <button onclick="zoom(-0.1)">−</button>
  <div id="zoom-label">100%</div>
  <button onclick="zoom(+0.1)">+</button>
</div>

<script>
var currentScale = 1;

window.addEventListener('load', function () {
    fitToScreen();
    setupDrag();
});

function drawConnectors() {
    var wrap = document.getElementById('treeWrap');
    var svg  = document.getElementById('connector-svg');
    svg.innerHTML = '';
    var wrapRect = wrap.getBoundingClientRect();

    wrap.querySelectorAll('.tree-node').forEach(function(node) {
        var personEl   = node.querySelector(':scope > .person');
        var childrenEl = node.querySelector(':scope > .tree-children');
        if (!personEl || !childrenEl) return;

        var childNodes = childrenEl.querySelectorAll(':scope > .tree-node');
        if (childNodes.length === 0) return;

        var pRect = personEl.getBoundingClientRect();
        var px = (pRect.left + pRect.width / 2 - wrapRect.left) / currentScale;
        var py = (pRect.bottom - wrapRect.top) / currentScale;

        var childPoints = [];
        childNodes.forEach(function(child) {
            var cPerson = child.querySelector(':scope > .person');
            if (!cPerson) return;
            var cRect = cPerson.getBoundingClientRect();
            childPoints.push({
                x: (cRect.left + cRect.width / 2 - wrapRect.left) / currentScale,
                y: (cRect.top  - wrapRect.top) / currentScale
            });
        });

        if (childPoints.length === 0) return;
        var midY = py + (childPoints[0].y - py) / 2;

        addLine(svg, px, py, px, midY);
        if (childPoints.length === 1) {
            addLine(svg, px, midY, childPoints[0].x, midY);
            addLine(svg, childPoints[0].x, midY, childPoints[0].x, childPoints[0].y);
        } else {
            addLine(svg, childPoints[0].x, midY, childPoints[childPoints.length-1].x, midY);
            childPoints.forEach(function(cp) {
                addLine(svg, cp.x, midY, cp.x, cp.y);
            });
        }
    });
}

function addLine(svg, x1, y1, x2, y2) {
    var line = document.createElementNS(
        'http://www.w3.org/2000/svg',
        'line'
    );

    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);

    line.setAttribute('stroke', '#fb7185');
    line.setAttribute('stroke-width', '1.2');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('opacity', '0.75');

    svg.appendChild(line);
}

function applyScale(scale) {
    currentScale = scale;
    var wrap = document.getElementById('treeWrap');
    wrap.style.transform = 'scale(' + scale + ')';
    wrap.style.transformOrigin = 'top center';
    document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
    requestAnimationFrame(function() {
        drawConnectors();
        var el = document.getElementById('treeScroll');
        el.scrollLeft = (el.scrollWidth - el.clientWidth) / 2;
    });
}

function fitToScreen() {
    var wrap = document.getElementById('treeWrap');
    var el   = document.getElementById('treeScroll');
    wrap.style.transform = 'scale(1)';
    requestAnimationFrame(function() {
        var scale = el.clientWidth / wrap.scrollWidth;
        scale = Math.max(scale, 0.1);
        applyScale(scale);
        requestAnimationFrame(function() {
            el.scrollTop  = 0;
            el.scrollLeft = (el.scrollWidth - el.clientWidth) / 2;
        });
    });
}

function zoom(delta) {
    const newScale = Math.min(
        Math.max(currentScale + delta, 0.1),
        2
    );

    applyScale(newScale);

    requestAnimationFrame(() => {
        drawConnectors();
    });
}

window.addEventListener('resize', fitToScreen);

function setupDrag() {
    const el = document.getElementById('treeScroll');

    let isDown = false;
    let startX;
    let startY;
    let scrollLeft;
    let scrollTop;

    el.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return; // left mouse only

        isDown = true;
        el.style.cursor = 'grabbing';

        startX = e.clientX;
        startY = e.clientY;

        scrollLeft = el.scrollLeft;
        scrollTop = el.scrollTop;
    });

    document.addEventListener('mouseup', () => {
        isDown = false;
        el.style.cursor = 'grab';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDown) return;

        e.preventDefault();

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        el.scrollLeft = scrollLeft - dx;
        el.scrollTop = scrollTop - dy;
    });
}

function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeModal(overlay.id);
    });
});
document.getElementById('treeScroll').addEventListener('wheel', function(e) {
    e.preventDefault();

    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    zoom(delta);
}, { passive: false });

async function downloadTreePDF() {

    const { jsPDF } = window.jspdf;

    const tree = document.getElementById('treeWrap');

    const oldTransform = tree.style.transform;

    tree.style.transform = 'scale(1)';

    await new Promise(resolve =>
        requestAnimationFrame(resolve)
    );

    const canvas = await html2canvas(tree, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff'
    });

    tree.style.transform = oldTransform;

    const imgData = canvas.toDataURL('image/png');

    const pdf = new jsPDF({
        orientation:
            canvas.width > canvas.height
                ? 'landscape'
                : 'portrait',
        unit: 'mm',
        format: 'a4'
    });

    const pageWidth =
        pdf.internal.pageSize.getWidth();

    const pageHeight =
        pdf.internal.pageSize.getHeight();

    const imgWidth = pageWidth;

    const imgHeight =
        (canvas.height * imgWidth) /
        canvas.width;

    let heightLeft = imgHeight;
    let position = 0;

    pdf.addImage(
        imgData,
        'PNG',
        0,
        position,
        imgWidth,
        imgHeight
    );

    heightLeft -= pageHeight;

    while (heightLeft > 0) {

        position = heightLeft - imgHeight;

        pdf.addPage();

        pdf.addImage(
            imgData,
            'PNG',
            0,
            position,
            imgWidth,
            imgHeight
        );

        heightLeft -= pageHeight;
    }

    pdf.save('family-tree.pdf');
}
</script>

</body>
</html>
