<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; }

.tree-scroll {
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    width: 100vw;
    height: calc(100vh - 60px);
    cursor: grab;
    position: relative;
    margin-top: 60px;
}
.tree-scroll:active { cursor: grabbing; }

.tree-wrap {
    display: inline-block;
    min-width: max-content;
    padding: 60px 400px;
    position: relative;
    transform-origin: top center;
}

#connector-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
}

.tree-node {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.tree-children {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 20px;
    margin-top: 40px;
}

.person {
    display: inline-block;
    border: 1.5px solid #a21caf;
    border-radius: 6px;
    background: #fdf4ff;
    color: #7e22ce;
    font-weight: 600;
    font-size: 12px;
    padding: 6px 12px;
    white-space: nowrap;
    position: relative;
    z-index: 1;
    text-align: center;
}

.person a { font-size: 11px; text-decoration: none; margin-left: 4px; }
.person .dt { display: block; font-size: 10px; font-weight: 400; color: #9333ea; margin-top: 2px; }

.site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: #fdf4ff;
    border-bottom: 1.5px solid #e9d5ff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
}

.site-header h1 {
    color: #a21caf;
    font-size: 20px;
    font-weight: 700;
    margin: 0;
}

.add-btn {
    position: absolute;
    right: 20px;
    background: #a21caf;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}
.add-btn:hover { background: #86198f; }

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 300;
    align-items: center;
    justify-content: center;
}
.modal-overlay.active { display: flex; }

.modal-box {
    background: #fff;
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
}

.modal-box h2 {
    color: #a21caf;
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 20px;
    text-align: center;
}

.field-group { margin-bottom: 14px; }

.field-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #7e22ce;
    margin-bottom: 4px;
}

.field-group input,
.field-group select {
    width: 100%;
    border: 1px solid #d8b4fe;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    color: #3b0764;
}

.field-group input:focus,
.field-group select:focus {
    border-color: #a21caf;
    box-shadow: 0 0 0 2px #f3e8ff;
}

.modal-actions { display: flex; gap: 10px; margin-top: 20px; }

.btn-save {
    flex: 1;
    background: #a21caf;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}
.btn-save:hover { background: #86198f; }

.btn-cancel {
    flex: 1;
    background: #fff;
    color: #7e22ce;
    border: 1.5px solid #a21caf;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}
.btn-cancel:hover { background: #fdf4ff; }

#btn-fit {
    position: fixed;
    bottom: 20px; right: 20px;
    z-index: 100;
    background: #fdf4ff;
    border: 1.5px solid #a21caf;
    color: #7e22ce;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
}
#btn-fit:hover { background: #f3e8ff; }

#zoom-controls {
    position: fixed;
    bottom: 20px; left: 20px;
    z-index: 100;
    display: flex;
    gap: 8px;
}
#zoom-controls button {
    background: #fdf4ff;
    border: 1.5px solid #a21caf;
    color: #7e22ce;
    font-weight: 700;
    font-size: 18px;
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
}
#zoom-controls button:hover { background: #f3e8ff; }
#zoom-label {
    background: #fdf4ff;
    border: 1.5px solid #a21caf;
    color: #7e22ce;
    font-size: 12px;
    font-weight: 600;
    padding: 0 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
}
</style>
</head>
<body>

<!-- Header -->
<div class="site-header">
    <h1>વેપારી કુટુંબનો સજરો</h1>
    <button class="add-btn" onclick="openModal('addModal')">+ નવો સભ્ય</button>
</div>

<!-- Tree -->
<div class="tree-scroll" id="treeScroll">
  <div class="tree-wrap" id="treeWrap">
    <svg id="connector-svg"></svg>
    <div class="tree-node">
      {% for root in roots %}
        {% include "tree_node.html" with member=root %}
      {% endfor %}
    </div>
  </div>
</div>

<!-- Add Member Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <h2>નવો સભ્ય ઉમેરો</h2>
    <form method="POST" action="{% url 'add_member' %}">
      {% csrf_token %}

      <div class="field-group">
        <label>નામ *</label>
        <input type="text" name="name" placeholder="સભ્યનું નામ દાખલ કરો" required />
      </div>

      <div class="field-group">
        <label>પિતાનું નામ</label>
        <select name="parent">
          <option value="">-- કોઈ નહીં (મૂળ) --</option>
          {% for m in members %}
            <option value="{{ m.id }}">{{ m.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field-group">
        <label>જન્મ તારીખ</label>
        <input type="date" name="birth_date" />
      </div>

      <div class="field-group">
        <label>અવસાન તારીખ <span style="font-size:10px;color:#9ca3af;">(વૈકલ્પિક)</span></label>
        <input type="date" name="death_date" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal('addModal')">રદ કરો</button>
        <button type="submit" class="btn-save">સાચવો</button>
      </div>
    </form>
  </div>
</div>

<button id="btn-fit" onclick="fitToScreen()">⛶ Fit</button>
<div id="zoom-controls">
  <button onclick="zoom(-0.1)">−</button>
  <div id="zoom-label">100%</div>
  <button onclick="zoom(+0.1)">+</button>
</div>

<script>
var currentScale = 1;

window.addEventListener('load', function () {
    fitToScreen();
    setupDrag();
});

function drawConnectors() {
    var wrap = document.getElementById('treeWrap');
    var svg  = document.getElementById('connector-svg');
    svg.innerHTML = '';
    var wrapRect = wrap.getBoundingClientRect();

    wrap.querySelectorAll('.tree-node').forEach(function(node) {
        var personEl   = node.querySelector(':scope > .person');
        var childrenEl = node.querySelector(':scope > .tree-children');
        if (!personEl || !childrenEl) return;

        var childNodes = childrenEl.querySelectorAll(':scope > .tree-node');
        if (childNodes.length === 0) return;

        var pRect = personEl.getBoundingClientRect();
        var px = (pRect.left + pRect.width / 2 - wrapRect.left) / currentScale;
        var py = (pRect.bottom - wrapRect.top) / currentScale;

        var childPoints = [];
        childNodes.forEach(function(child) {
            var cPerson = child.querySelector(':scope > .person');
            if (!cPerson) return;
            var cRect = cPerson.getBoundingClientRect();
            childPoints.push({
                x: (cRect.left + cRect.width / 2 - wrapRect.left) / currentScale,
                y: (cRect.top  - wrapRect.top) / currentScale
            });
        });

        if (childPoints.length === 0) return;
        var midY = py + (childPoints[0].y - py) / 2;

        addLine(svg, px, py, px, midY);
        if (childPoints.length === 1) {
            addLine(svg, px, midY, childPoints[0].x, midY);
            addLine(svg, childPoints[0].x, midY, childPoints[0].x, childPoints[0].y);
        } else {
            addLine(svg, childPoints[0].x, midY, childPoints[childPoints.length-1].x, midY);
            childPoints.forEach(function(cp) {
                addLine(svg, cp.x, midY, cp.x, cp.y);
            });
        }
    });
}

function addLine(svg, x1, y1, x2, y2) {
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#a21caf');
    line.setAttribute('stroke-width', 2 / currentScale);
    svg.appendChild(line);
}

function applyScale(scale) {
    currentScale = scale;
    var wrap = document.getElementById('treeWrap');
    wrap.style.transform = 'scale(' + scale + ')';
    wrap.style.transformOrigin = 'top center';
    document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
    requestAnimationFrame(function() {
        drawConnectors();
        var el = document.getElementById('treeScroll');
        el.scrollLeft = (el.scrollWidth - el.clientWidth) / 2;
    });
}

function fitToScreen() {
    var wrap = document.getElementById('treeWrap');
    var el   = document.getElementById('treeScroll');
    wrap.style.transform = 'scale(1)';
    requestAnimationFrame(function() {
        var scale = el.clientWidth / wrap.scrollWidth;
        scale = Math.max(scale, 0.1);
        applyScale(scale);
        requestAnimationFrame(function() {
            el.scrollTop  = 0;
            el.scrollLeft = (el.scrollWidth - el.clientWidth) / 2;
        });
    });
}

function zoom(delta) {
    applyScale(Math.min(Math.max(currentScale + delta, 0.1), 2));
}

window.addEventListener('resize', fitToScreen);

function setupDrag() {
    var el = document.getElementById('treeScroll');
    var isDown = false, startX, startY, scrollLeft, scrollTop;
    el.addEventListener('mousedown', function(e) {
        isDown = true;
        startX = e.pageX - el.offsetLeft;
        startY = e.pageY - el.offsetTop;
        scrollLeft = el.scrollLeft;
        scrollTop  = el.scrollTop;
    });
    el.addEventListener('mouseleave', function() { isDown = false; });
    el.addEventListener('mouseup',    function() { isDown = false; });
    el.addEventListener('mousemove',  function(e) {
        if (!isDown) return;
        e.preventDefault();
        el.scrollLeft = scrollLeft - (e.pageX - el.offsetLeft - startX);
        el.scrollTop  = scrollTop  - (e.pageY - el.offsetTop  - startY);
    });
}

function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeModal(overlay.id);
    });
});
</script>

</body>
</html>
